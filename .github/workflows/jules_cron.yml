name: "Jules Memory Compression Engine"

on:
  schedule:
    # 17:00 UTC = 22:00 по времени Астаны (UTC+5) каждое воскресенье
    # Запускается ДО вечернего Спарка (22:30), чтобы обновить контекст перед планированием понедельника
    - cron: '0 17 * * 0'
  workflow_dispatch:

jobs:
  compress-memory:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jules Cloud Agent
        uses: google-labs-code/jules-action@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: 'main'
          prompt: |
            Ты — автономный аналитик и архивариус моего Второго Мозга.
            
            1. В репозитории найди и внимательно прочитай файл '00_System/JULES.md'.
            2. Строго выполни все инструкции и алгоритмы анализа которые описаны в этом файле.
            4. Сделай коммит напрямую в ветку main с сообщением: 'chore(memory): weekly compression via JULES.md'.
